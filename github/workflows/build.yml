name: Build AXELL Client V4

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build the mod
        run: gradle build --no-daemon

      - name: Upload the .jar
        uses: actions/upload-artifact@v4
        with:
          name: AXELL-Client-V4
          path: build/libs/*.jar
